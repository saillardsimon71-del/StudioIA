name: Studio V2 social

on:
  push:
    branches: [arena/studio-ia-v2-rebuild]
    paths:
      - studio-v2/**
      - .github/workflows/x_post.yml
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: studio-v2-social-${{ github.event_name == 'push' && github.ref || 'publisher' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install -r studio-v2/social/requirements-test.txt
      - name: Offline V2 suite
        env:
          MODAL_CONFIG_PATH: ${{ runner.temp }}/empty-modal.toml
          STUDIO_V2_DATA_DIR: ${{ runner.temp }}/studio-v2-test-data
        run: python -m pytest studio-v2/tests -q
      - name: Lead magnet generation
        run: python studio-v2/social/build_lead_magnet.py --output "${{ runner.temp }}/bible.pdf"

  publish:
    if: github.event_name != 'push' && vars.X_AUTOMATION_ENABLED == 'true'
    runs-on: [self-hosted, studio-v2-social]
    timeout-minutes: 10
    env:
      STUDIO_V2_DATA_DIR: ${{ vars.STUDIO_V2_DATA_DIR }}
      STUDIO_LANDING_URL: ${{ vars.STUDIO_LANDING_URL }}
      STUDIO_CHECKOUT_URL: ${{ vars.STUDIO_CHECKOUT_URL }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      KIT_FORM_ID: ${{ vars.KIT_FORM_ID }}
      KIT_SEQUENCE_ID: ${{ vars.KIT_SEQUENCE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: arena/studio-ia-v2-rebuild
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install -r studio-v2/social/requirements.txt
      - name: Persistent Studio data preflight
        shell: bash
        run: |
          python -c "import os; from pathlib import Path; p=Path(os.environ['STUDIO_V2_DATA_DIR']); assert p.is_absolute() and (p/'v2.db').is_file() and not p.resolve().is_relative_to(Path.cwd().resolve()), 'Configure persistent V2 data outside the Actions checkout'"
      - name: Publish due posts and process opted-in leads
        shell: bash
        run: python studio-v2/social/x_scheduler.py --publish --backend api --data-dir "$STUDIO_V2_DATA_DIR"
